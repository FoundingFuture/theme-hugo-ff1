baseURL = "https://example.org/"
title = "FoundingFuture I"
locale = "en"
theme = "foundingfuture-i"

[markup.goldmark.renderer]
  unsafe = true

[params]
  tagline = "A Hugo theme for topics of any depth, and a lot of text on one screen"
  established = "a hugo theme"
  domains = ["example.org"]
  # Topics take these in order unless a section sets colour itself.
  palette = ["teal", "indigo", "rose", "amber"]

# Anything that is not a topic. The rail lists these after the tree.
[[params.extraNav]]
  name = "Tags"
  url = "/tags/"

[[params.extraNav]]
  name = "Search"
  url = "/search/"

[[params.extraNav]]
  name = "Screenshots"
  url = "/screenshots/"
