{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ with .Description }}<p class="note">{{ . }}</p>{{ end }}
{{ .Content }}

{{ partial "topicmenu.html" . }}

{{ with .RegularPages }}
<ul class="pieces">
	{{ range . }}
	<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
	{{ end }}
</ul>
{{ end }}
{{ end }}
