# Every word the theme puts on a page.
#
# A site overrides any of these by shipping its own i18n/en.toml. Hugo merges
# the site's file over the theme's, key by key, so a site changes one word
# without restating the rest.
#
# The defaults speak to readers rather than to authors: a visitor knows what
# a topic is and has no reason to know what Hugo calls a section. Change any
# of them if your site disagrees.

[mainPage]
other = "Main page"

[menu]
other = "Menu"

[index]
other = "Index"


[sections]
other = "Topics"


[subsections]
other = "Subtopics"

[piecesTitle]
other = "Pieces"

[pieceCount]
one = "{{ .Count }} piece"
other = "{{ .Count }} pieces"

[subsectionCount]
one = "{{ .Count }} subtopic"
other = "{{ .Count }} subtopics"

[activeCount]
one = "{{ .Count }} active"
other = "{{ .Count }} active"

[furtherDown]
other = "Further down"

[nearThis]
other = "Near this"

[onThisPage]
other = "On this page"

[previous]
other = "Previous"

[next]
other = "Next"

[reading]
other = "Reading"

[searchLabel]
other = "Search"

[searchPlaceholder]
other = "A word from a title, the text or a tag"

[searchNothing]
other = "Nothing matches that."

[searchLoading]
other = "Loading the index…"

[searchFailed]
other = "The index did not load."

[updated]
other = "updated"

[linkToSection]
other = "Link to this section"

[termDeck]
one = "{{ .Count }} piece, {{ .Taxonomy }} {{ .Term }}."
other = "{{ .Count }} pieces, {{ .Taxonomy }} {{ .Term }}."

[allTerms]
other = "all {{ .Taxonomy }}"

[termsDeck]
other = "Pick one, then another. Those that cannot go with what you have picked drop away."

[clear]
other = "clear"

[noMatch]
other = "Nothing carries all of those together. Drop one."
